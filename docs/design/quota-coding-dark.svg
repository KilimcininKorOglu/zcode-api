<svg xmlns="http://www.w3.org/2000/svg" width="390" height="570" viewBox="0 0 390 570" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">
  <title>Usage display design reference - count-based plan (coding-plan) - dark</title>
  <defs>
    <pattern id="st" width="8" height="6" patternUnits="userSpaceOnUse">
      <rect width="4.5" height="6" fill="#7EC3DF" fill-opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="390" height="570" fill="#12181D"/>

  <!-- Top bar (context) -->
  <rect x="16" y="16" width="40" height="40" rx="10" fill="#7EC3DF"/>
  <text x="36" y="36" font-size="20" font-weight="700" fill="#0C2A38" text-anchor="middle" dominant-baseline="middle">Z</text>
  <text x="68" y="38" font-size="20" font-weight="600" fill="#DEE7EA">ZCode Proxy</text>
  <text x="68" y="54" font-size="12" fill="#9DAEB6">Local reverse proxy - Connected</text>

  <!-- Hero card -->
  <rect x="16" y="72" width="358" height="284" rx="24" fill="#17475E"/>

  <!-- Status row -->
  <circle cx="41" cy="96" r="9" fill="#5BC89B" fill-opacity="0.18"/>
  <circle cx="41" cy="96" r="5" fill="#5BC89B"/>
  <text x="56" y="96" font-size="20" font-weight="600" fill="#D9EEF6" dominant-baseline="middle">Running</text>
  <rect x="258" y="84" width="96" height="24" rx="12" fill="#7EC3DF" fill-opacity="0.14"/>
  <text x="306" y="96" font-size="12" font-family="ui-monospace,Consolas,monospace" fill="#D9EEF6" text-anchor="middle" dominant-baseline="middle">coding-plan</text>

  <!-- Address row -->
  <text x="36" y="144" font-size="24" font-weight="600" font-family="ui-monospace,Consolas,monospace" fill="#D9EEF6" dominant-baseline="middle">127.0.0.1:8317</text>
  <rect x="290" y="128" width="64" height="32" rx="16" fill="none" stroke="#7EC3DF" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="300" y="136" width="10" height="12" rx="2" fill="none" stroke="#D9EEF6" stroke-opacity="0.85" stroke-width="1.5"/>
  <rect x="305" y="141" width="10" height="12" rx="2" fill="#17475E" stroke="#D9EEF6" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="332" y="145" font-size="13" fill="#D9EEF6" text-anchor="middle" dominant-baseline="middle">Copy</text>

  <!-- ★ Usage block (replaces 'last 60 min requests', same position and size) -->
  <text x="36" y="188" font-size="11" fill="#D9EEF6" fill-opacity="0.65" dominant-baseline="middle">Plan usage</text>
  <rect x="92" y="179" width="44" height="18" rx="9" fill="#7EC3DF" fill-opacity="0.14"/>
  <text x="114" y="188" font-size="10" font-weight="600" font-family="ui-monospace,Consolas,monospace" fill="#D9EEF6" text-anchor="middle" dominant-baseline="middle">Max</text>
  <text x="354" y="188" font-size="11" font-family="ui-monospace,Consolas,monospace" fill="#D9EEF6" fill-opacity="0.65" text-anchor="end" dominant-baseline="middle">UP 02:14:36</text>

  <!-- 5h: with percentage -> solid remaining-ratio bar; value = remaining; subline = reset countdown -->
  <text x="36" y="216" font-size="12" font-weight="600" fill="#D9EEF6" dominant-baseline="middle">5h</text>
  <rect x="100" y="211" width="184" height="6" rx="3" fill="#7EC3DF" fill-opacity="0.12"/>
  <rect x="100" y="211" width="114" height="6" rx="3" fill="#7EC3DF"/>
  <text x="354" y="212" font-size="12" font-weight="600" font-family="ui-monospace,Consolas,monospace" fill="#7EC3DF" text-anchor="end" dominant-baseline="middle">3,894 left</text>
  <text x="354" y="227" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#D9EEF6" fill-opacity="0.55" text-anchor="end" dominant-baseline="middle">1h 54m left</text>

  <!-- Weekly: without percentage -> striped time-progress fallback -->
  <text x="36" y="252" font-size="12" font-weight="600" fill="#D9EEF6" dominant-baseline="middle">Weekly</text>
  <rect x="100" y="247" width="184" height="6" rx="3" fill="#7EC3DF" fill-opacity="0.12"/>
  <rect x="100" y="247" width="57" height="6" rx="3" fill="#7EC3DF" fill-opacity="0.15"/>
  <rect x="100" y="247" width="57" height="6" rx="3" fill="url(#st)"/>
  <text x="354" y="248" font-size="12" font-weight="600" font-family="ui-monospace,Consolas,monospace" fill="#D9EEF6" text-anchor="end" dominant-baseline="middle">12,306 left</text>
  <text x="354" y="263" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#D9EEF6" fill-opacity="0.55" text-anchor="end" dominant-baseline="middle">4d 20h left</text>

  <!-- Buttons -->
  <rect x="36" y="278" width="318" height="52" rx="26" fill="#7EC3DF"/>
  <rect x="151" y="297" width="14" height="14" rx="3" fill="#0C2A38"/>
  <text x="201" y="304" font-size="16" font-weight="600" fill="#0C2A38" text-anchor="middle" dominant-baseline="middle">Stop proxy</text>

  <!-- Design spec -->
  <text x="16" y="412" font-size="12" font-weight="600" fill="#DEE7EA">Design spec - coding-plan (monitor plane, count-based) - dark</text>
  <rect x="16" y="426" width="18" height="10" rx="3" fill="#7EC3DF"/>
  <text x="42" y="435" font-size="11" fill="#9DAEB6">Solid bar = remaining ratio (1 - used%), same threshold colors as credit</text>
  <rect x="16" y="444" width="18" height="10" rx="3" fill="#7EC3DF" fill-opacity="0.15"/>
  <rect x="16" y="444" width="18" height="10" rx="3" fill="url(#st)"/>
  <text x="42" y="453" font-size="11" fill="#9DAEB6">Without percentage fall back to striped time progress; value = remaining left</text>
  <text x="16" y="471" font-size="11" fill="#9DAEB6">Gray subline = reset countdown; two rows = 5h / Weekly windows</text>
  <text x="16" y="489" font-size="11" fill="#9DAEB6">Max pill = data.level - tap block to refresh (rate-limited)</text>
</svg>
